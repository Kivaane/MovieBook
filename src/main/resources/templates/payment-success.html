<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head>
    <title>Booking Confirmed - CineBook</title>
</head>
<body>
    <section class="container my-5 py-5 text-center">
        <div class="fade-in">
            <div class="mb-5">
                <i class="fas fa-check-circle fa-7x text-success"></i>
            </div>
            <h1 class="display-3 mb-3">BOOKING CONFIRMED!</h1>
            <p class="fs-4 text-muted mb-5">Your cinematic journey at CineBook is ready.</p>
            
            <div class="row">
                <div class="col-md-6 mx-auto">
                    <div class="form-container text-start p-5">
                        <div class="d-flex justify-content-between mb-4 border-bottom pb-3">
                            <h4 class="text-gold m-0">e-Ticket Details</h4>
                            <span class="badge badge-success">PAID</span>
                        </div>
                        
                        <div class="mb-4">
                            <label class="text-muted d-block small mb-1">BOOKING ID</label>
                            <h5 th:text="'#CB-' + ${booking.bookingId}">#CB-12345</h5>
                        </div>
                        
                        <div class="mb-4">
                            <label class="text-muted d-block small mb-1">MOVIE</label>
                            <h5 th:text="${booking.movieTitle}">Leo</h5>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-6">
                                <label class="text-muted d-block small mb-1">SHOWTIME</label>
                                <h5 th:text="${booking.showtime}">10:00 AM</h5>
                            </div>
                            <div class="col-6">
                                <label class="text-muted d-block small mb-1">HALL</label>
                                <h5 th:text="${booking.hallName}">Hall A</h5>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="text-muted d-block small mb-1">SEATS</label>
                            <div class="d-flex flex-wrap gap-2">
                                <span th:each="seat : ${booking.seatArray}" class="badge badge-gold" th:text="${seat}">A1</span>
                            </div>
                        </div>
                        
                        <div class="bg-dark p-3 rounded text-center mb-0 mt-5 border border-gold">
                            <i class="fas fa-qrcode fa-5x mb-3 text-white"></i>
                            <p class="small text-muted mb-0">Show this QR code at the entrance</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-5">
                <a th:href="@{/bookings/my-bookings}" class="btn btn-primary px-5 mx-2">MY BOOKINGS</a>
                <a th:href="@{/}" class="btn btn-outline px-5 mx-2">BACK TO HOME</a>
            </div>
        </div>
    </section>
</body>
</html>
