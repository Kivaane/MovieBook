<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head>
    <title>CineBook - Login</title>
</head>
<body>
    <section class="container my-5">
        <div class="form-container slide-up">
            <h2 class="text-center mb-4">WELCOME BACK</h2>
            <p class="text-center text-muted mb-5">Login to access your premium membership</p>
            
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            
            <form th:action="@{/user/login}" method="post">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-4">LOGIN</button>
            </form>
            
            <div class="text-center mt-4">
                <p>New to CineBook? <a th:href="@{/user/register}">Register now</a></p>
            </div>
        </div>
    </section>
</body>
</html>
