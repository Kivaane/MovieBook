<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head>
    <title>Admin Dashboard - CineBook</title>
</head>
<body>
    <section class="container my-5">
        <div class="row mb-5">
            <div class="col-12">
                <h1 class="text-gold mb-4">ADMIN DASHBOARD</h1>
                <p class="text-muted">Welcome back, Administrator. Overview of system performance.</p>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <!-- Stats Cards -->
            <div class="col-md-3">
                <div class="glass-card p-4 text-center border-gold">
                    <h5 class="text-muted small text-uppercase">Total Movies</h5>
                    <div class="display-4 text-gold" th:text="${movieCount}">0</div>
                    <a th:href="@{/admin/movies}" class="btn btn-sm btn-outline-gold mt-3">Manage</a>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card p-4 text-center border-gold">
                    <h5 class="text-muted small text-uppercase">Active Halls</h5>
                    <div class="display-4 text-gold" th:text="${hallCount}">0</div>
                    <a th:href="@{/admin/halls}" class="btn btn-sm btn-outline-gold mt-3">Manage</a>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card p-4 text-center border-gold">
                    <h5 class="text-muted small text-uppercase">Transactions</h5>
                    <div class="display-4 text-gold" th:text="${bookingCount}">0</div>
                    <a th:href="@{/admin/transactions}" class="btn btn-sm btn-outline-gold mt-3">View All</a>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card p-4 text-center border-gold">
                    <h5 class="text-muted small text-uppercase">Feedback</h5>
                    <div class="display-4 text-gold" th:text="${userCount}">0</div>
                    <a th:href="@{/admin/feedback}" class="btn btn-sm btn-outline-gold mt-3">Manage</a>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="glass-card p-4 border-gold">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="text-gold m-0">RECENT BOOKINGS</h4>
                    <a th:href="@{/admin/bookings}" class="btn btn-sm btn-primary">VIEW ALL BOOKINGS</a>
                </div>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Movie</th>
                                    <th>Showtime</th>
                                    <th>Seats</th>
                                    <th>Price</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="booking : ${recentBookings}">
                                    <td th:text="${booking.bookingId}">1</td>
                                    <td th:text="${booking.movieId}">Movie</td>
                                    <td th:text="${booking.showtime}">10:00 AM</td>
                                    <td th:text="${booking.seats}">A1, A2</td>
                                    <td th:text="'LKR ' + ${booking.totalPrice}">LKR 1200</td>
                                    <td>
                                        <span class="badge bg-success" th:text="${booking.status}">Confirmed</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
