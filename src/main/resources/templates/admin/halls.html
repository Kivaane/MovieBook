<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head>
    <title>Manage Halls - CineBook</title>
</head>
<body>
    <section class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-gold">MANAGE HALLS</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addHallModal">
                ADD NEW HALL
            </button>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div class="glass-card p-0 overflow-hidden border-gold">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Hall Name</th>
                            <th>Type</th>
                            <th>Capacity</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="hall : ${halls}">
                            <td th:text="${hall.hallId}">1</td>
                            <td th:text="${hall.hallName}">Hall A</td>
                            <td th:text="${hall.hallType}">IMAX</td>
                            <td th:text="${hall.capacity}">100</td>
                            <td>
                                <a th:href="@{'/admin/halls/delete/' + ${hall.hallId}}" 
                                   class="btn btn-sm btn-danger" 
                                   onclick="return confirm('Are you sure?')">DELETE</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add Hall Modal -->
        <div class="modal fade" id="addHallModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content bg-dark text-white border-gold">
                    <div class="modal-header border-gold">
                        <h5 class="modal-title text-gold">ADD NEW HALL</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/admin/halls/add}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Hall Name</label>
                                <input type="text" name="hallName" class="form-control" placeholder="e.g. Hall A" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Hall Type</label>
                                <select name="hallType" class="form-control">
                                    <option value="Standard">Standard</option>
                                    <option value="IMAX">IMAX</option>
                                    <option value="Premium 4D">Premium 4D</option>
                                    <option value="VIP Lounge">VIP Lounge</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Capacity</label>
                                <input type="number" name="capacity" class="form-control" value="100" required>
                            </div>
                        </div>
                        <div class="modal-footer border-gold">
                            <button type="submit" class="btn btn-primary">SAVE HALL</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
