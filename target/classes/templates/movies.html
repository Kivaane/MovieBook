<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head>
    <title>CineBook - Now Showing</title>
</head>
<body>
    <section class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2>NOW SHOWING</h2>
            <form th:action="@{/movies/search}" method="get" class="d-flex gap-2">
                <input type="text" name="q" class="form-control" placeholder="Search movies..." style="width: 300px;">
                <button type="submit" class="btn btn-primary d-flex align-items-center"><i class="fas fa-search"></i></button>
            </form>
        </div>
        
        <div class="movie-grid">
            <div class="movie-card" th:each="movie : ${movies}">
                <img th:src="@{'/images/movies/' + ${movie.posterImage}}" 
                     th:alt="${movie.title}" 
                     class="movie-poster">
                <div class="movie-info">
                    <h3 class="movie-title" th:text="${movie.title}">Movie Title</h3>
                    <div class="movie-meta">
                        <span class="movie-genre" th:text="${movie.genre}">Genre</span>
                        <div class="movie-rating">
                            <i class="fas fa-star"></i>
                            <span th:text="${movie.rating}">4.5</span>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <div class="movie-price">
                            LKR <span th:text="${#numbers.formatDecimal(movie.price, 0, 'COMMA', 2, 'POINT')}">1200</span>
                        </div>
                        <a th:href="@{'/movies/' + ${movie.movieId}}" class="btn btn-primary btn-sm px-4">
                            BOOK NOW
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${movies.empty}" class="text-center my-5 py-5">
            <i class="fas fa-search fa-4x text-muted mb-4"></i>
            <h3>No movies found</h3>
            <p>Try searching for something else or view all movies.</p>
            <a th:href="@{/movies}" class="btn btn-outline mt-3">VIEW ALL MOVIES</a>
        </div>
    </section>
</body>
</html>
