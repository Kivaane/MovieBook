<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head>
    <title>Feedback - CineBook</title>
</head>
<body>
    <section class="container my-5">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="form-container slide-up">
                    <h1 class="text-center text-gold mb-4">FEEDBACK</h1>
                    <p class="text-center text-muted mb-5">WE VALUE YOUR PREMIUM EXPERIENCE</p>
                    
                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                    <form th:action="@{/feedback/submit}" method="post">
                        <div class="row">
                            <div class="col-md-6" th:if="${session.user == null}">
                                <div class="form-group">
                                    <label class="form-label">Your Name</label>
                                    <input type="text" name="userName" class="form-control" placeholder="NAME">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Feedback Type</label>
                                    <select name="feedbackType" class="form-control" required>
                                        <option value="General">General</option>
                                        <option value="Service">Service Quality</option>
                                        <option value="Website">Website Experience</option>
                                        <option value="Theater">Theater Environment</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Subject</label>
                            <input type="text" name="subject" class="form-control" placeholder="SUMMARY OF YOUR FEEDBACK" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Message</label>
                            <textarea name="message" class="form-control" rows="5" placeholder="TELL US MORE ABOUT YOUR EXPERIENCE..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-4 py-3">
                            SUBMIT FEEDBACK
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
