<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head>
    <title>My Bookings - CineBook</title>
</head>
<body>
    <section class="container my-5">
        <h2 class="mb-5 text-gold">MY RESERVATIONS</h2>
        
        <div class="table-container fade-in">
            <table class="table mb-0">
                <thead>
                    <tr>
                        <th>Booking ID</th>
                        <th>Movie</th>
                        <th>Showtime</th>
                        <th>Seat(s)</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="booking : ${bookings}">
                        <td th:text="'#CB-' + ${booking.bookingId}">#CB-1</td>
                        <td>
                            <strong th:text="${booking.movieTitle}" class="text-gold">Movie Title</strong>
                        </td>
                        <td th:text="${booking.showtime}">10:00 AM</td>
                        <td>
                            <span th:each="seat : ${booking.seatArray}" class="badge badge-gold me-1" th:text="${seat}">A1</span>
                        </td>
                        <td th:text="'LKR ' + ${booking.totalPrice}">LKR 1200</td>
                        <td>
                            <span class="badge" th:classappend="${booking.status == 'confirmed' ? 'badge-success' : 'badge-danger'}" th:text="${booking.status}">Confirmed</span>
                        </td>
                        <td>
                            <button class="btn btn-outline btn-sm px-3 me-2"><i class="fas fa-download me-2"></i>TICKET</button>
                            <a th:if="${booking.status == 'confirmed'}" th:href="@{'/bookings/cancel/' + ${booking.bookingId}}" 
                               class="btn btn-sm btn-danger px-3" onclick="return confirm('Are you sure you want to cancel?')">CANCEL</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div th:if="${bookings.empty}" class="text-center py-5">
            <i class="fas fa-ticket-alt fa-4x text-muted mb-4"></i>
            <h3>No bookings found</h3>
            <p>You haven't made any reservations yet. Go ahead and book your favorite movies!</p>
            <a th:href="@{/movies}" class="btn btn-primary mt-3">EXPLORE MOVIES</a>
        </div>
    </section>
</body>
</html>
