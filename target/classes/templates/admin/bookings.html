<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head>
    <title>Manage Bookings - CineBook</title>
</head>
<body>
    <section class="container my-5">
        <h1 class="text-gold mb-4">ALL BOOKINGS</h1>

        <div class="glass-card p-0 overflow-hidden border-gold">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User ID</th>
                            <th>Movie ID</th>
                            <th>Showtime</th>
                            <th>Seats</th>
                            <th>Total Price</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="booking : ${bookings}">
                            <td th:text="${booking.bookingId}">1</td>
                            <td th:text="${booking.userId}">1</td>
                            <td th:text="${booking.movieId}">1</td>
                            <td th:text="${booking.showtime}">10:00 AM</td>
                            <td th:text="${booking.seats}">A1, A2</td>
                            <td th:text="'LKR ' + ${booking.totalPrice}">LKR 1200</td>
                            <td>
                                <span class="badge" th:classappend="${booking.status == 'confirmed' ? 'bg-success' : 'bg-danger'}" th:text="${booking.status}">Confirmed</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</body>
</html>
