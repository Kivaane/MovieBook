<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head>
    <title>Manage Feedback - CineBook</title>
</head>
<body>
    <section class="container my-5">
        <h1 class="text-gold mb-4">USER FEEDBACK</h1>

        <div class="glass-card p-0 overflow-hidden border-gold">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Type</th>
                            <th>Subject</th>
                            <th>Message</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="f : ${feedbacks}">
                            <td th:text="${f.feedbackId}">1</td>
                            <td th:text="${f.userName}">Anonymous</td>
                            <td th:text="${f.feedbackType}">General</td>
                            <td th:text="${f.subject}">Subject</td>
                            <td th:text="${f.message}">Message body...</td>
                            <td th:text="${f.submissionDate}">2024-04-26</td>
                            <td>
                                <span class="badge bg-warning text-dark" th:text="${f.status}">Pending</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</body>
</html>
